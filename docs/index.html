<!DOCTYPE html>
<html lang="en">

<head>
    <title>Casual Pokémon Teambuilder</title>
    <meta charset="UTF-8">
    <meta name="author" content="Sam Cunion">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Plan a balanced and fun Pokémon team for your casual playthrough!" />
    <meta name="application-name" content="Casual Pokémon Teambuilder" />
    <script>
        const isGithub = location.hostname.endsWith("github.io");
        if (isGithub) {
            document.write(`<base href="/pokemon-casual-teambuilder/">`);
        }
    </script>
    <link rel="icon" href="/public/img/icon/favicon.ico" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" type="text/css" href="/public/css/style.css" />
</head>

<body>
    <div>
        <h1 class="text-center mt-4" id="index-title">Casual Pokémon Teambuilder</h1>
        <input type="text" placeholder="Filter Games..." class="form-comtrol mx-auto mt-5" id="game-search" />
        <div class="d-flex justify-content-center w-auto ms-5 me-5 mt-5 mb-5">
            <div id="game-list" class="d-flex flex-wrap justify-content-around"></div>
        </div>
    </div>
    <footer id="credits-bar" class="bg-primary bg-gradient border-top border-4 border-primary d-flex justify-content-between align-items-center pt-2 pb-2">
        <div id="name-credit">
            <p class="ps-3 text-light float-start m-0">Made by Sam Cunion</p>
        </div>
        <div id="site-credit">
            <p class="text-light m-0 text-decoration-underline">www.sam-on-the.net/pokemon-teambuilder</p>
        </div>
        <div class="h-100 me-3 d-flex">
            <a class="text-light m-0 d-none" id="expand-credits" href="javascript:void(0)">Credits</a>
        </div>
    </footer>
    <script type="text/javascript" src="/public/js/catalogue.js"></script>
</body>

</html>
