<!DOCTYPE html>
<html lang="en">

<head>
    <title>Casual Pokémon Teambuilder</title>
    <meta charset="UTF-8">
    <meta name="author" content="Sam Cunion">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Plan a balanced and fun Pokémon team for your casual playthrough!" />
    <meta name="application-name" content="Casual Pokémon Teambuilder" />
    <link rel="icon" href="/public/img/icon/favicon.ico" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" type="text/css" href="public/css/style.css" />
</head>

<body>
    <div id="page-game-select" class="page">
        <div id="GameSelector">
            <h1 class="text-center mt-4">Casual Pokémon Teambuilder</h1>
            <input type="text" placeholder="Filter Games..." class="form-comtrol mx-auto mt-5" id="game-search" />
            <div id="game-list" class="d-flex flex-wrap"></div>
        </div>
    </div>
    <footer id="credits-bar" class="bg-primary bg-gradient border-top border-4 border-primary">
        <div id="name-credit">
            <p class="ps-3 pt-2 text-light float-start">Made by Sam Cunion</p>
        </div>
        <div id="credit-expand-button" class="float-end h-100 me-3">
            <p class="text-light pt-2 float-start">Credits:</p>
            <button class="btn btn-outline-light float-end ms-3 top-50" id="expand-credits">...</button>
        </div>
    </footer>
    <div id="info-overlay">
        <div id="info-overlay-content"></div>
    </div>
    <script type="text/javascript" src="/public/js/catalogue.js"></script>
</body>

</html>
